name: Dark Facts V2 Five-Video Cloud Test

on:
  workflow_dispatch:
  push:
    branches:
      - production-factory-v1
    paths:
      - "factory/**"
      - "data/facts.json"
      - "tests/**"
      - ".github/workflows/v2-prototype.yml"

permissions:
  contents: read

concurrency:
  group: dark-facts-v2-cloud-test
  cancel-in-progress: false

jobs:
  render-five:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-factory-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install Blender 4.2 LTS
        run: |
          curl -fL "https://download.blender.org/release/Blender4.2/blender-4.2.5-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          echo "BLENDER_PATH=/tmp/blender-4.2.5-linux-x64/blender" >> "$GITHUB_ENV"
          /tmp/blender-4.2.5-linux-x64/blender --version
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Render five distinct Shorts (NO UPLOAD)
        run: python -m factory.run --count 5 --output output --no-upload
      - name: Verify five unique outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("output/manifest.json").read_text())
          assert len(manifest)==5, f"expected 5 records, got {len(manifest)}"
          ids=[x.get("fact_id") for x in manifest]
          assert len(set(ids))==5, f"duplicate fact IDs: {ids}"
          failed=[x for x in manifest if x.get("rendering_status")!="success"]
          if failed:
              raise SystemExit(f"render failures: {failed}")
          print("PASS: five unique Shorts rendered successfully; uploads disabled.")
          PY
      - name: Upload render artifacts and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-facts-five-video-cloud-test-${{ github.run_number }}
          path: output/
          retention-days: 14
          if-no-files-found: warn
