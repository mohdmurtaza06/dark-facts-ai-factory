name: Cinematic rebuild - style frame

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-style-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cinematic-rebuild
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Render original 3D character style frame
        run: blender --background --python renderer/blender/pilot_scene.py
      - uses: actions/upload-artifact@v4
        with:
          name: cinematic-rebuild-style-frame
          path: /tmp/dark-facts-style-test.png
          if-no-files-found: error
          retention-days: 7
