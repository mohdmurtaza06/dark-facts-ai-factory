name: Render cinematic pilot (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: renderer/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install renderer dependencies
        run: npm install --no-audit --no-fund
      - name: Install free narration dependency
        run: python -m pip install edge-tts
      - name: Generate original narration and ambience
        run: npm run audio:pilot
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Render 60-second 1080x1920 pilot
        run: npx remotion render src/index.ts DarkMysteryPilot out/the-last-elevator.mp4 --codec=h264 --crf=23
      - name: Probe rendered file
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,width,height,codec_name -of json out/the-last-elevator.mp4
          python - <<'PY'
          import json, subprocess
          p = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "json", "out/the-last-elevator.mp4"], check=True, capture_output=True, text=True)
          duration = float(json.loads(p.stdout)["format"]["duration"])
          assert 55 <= duration <= 70, f"Unexpected duration: {duration}"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dark-facts-the-last-elevator-pilot
          path: renderer/out/the-last-elevator.mp4
          if-no-files-found: error
          retention-days: 7
